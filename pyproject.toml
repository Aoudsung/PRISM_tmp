[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fgpo"
version = "2.0.0"
description = "Finite-horizon history-conditioned peer credit on official ALFWorld and AppWorld"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
fgpo-study = "fgpo.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fgpo*"]
