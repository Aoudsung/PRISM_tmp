[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-native-r3"
version = "0.3.3"
description = "Public execution state and full-trace cold-start for native PRISM experiments"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
